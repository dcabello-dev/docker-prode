{% extends 'prode/base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="bg-gray-800 p-8 rounded-xl border border-gray-700 shadow-2xl max-w-md w-full">
        <h2 class="text-2xl font-extrabold text-center mb-2 bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">
            Recuperar Contraseña
        </h2>
        <p class="text-gray-400 text-sm text-center mb-6">
            Ingresá tu correo electrónico y te enviaremos un enlace para restablecerla.
        </p>

        <form method="post" class="space-y-4 text-gray-300">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded-lg transition duration-200 shadow-md">
                Enviar enlace de recuperación
            </button>
        </form>

        <p class="text-center mt-4">
            <a href="{% url 'login' %}" class="text-sm text-indigo-400 hover:text-indigo-300 transition duration-200">
                Volver al ingreso
            </a>
        </p>
    </div>
</div>
{% endblock %}
