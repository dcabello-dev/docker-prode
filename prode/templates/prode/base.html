<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prode Mundial Institucional</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col">
    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <a href="{% url 'panel_prode' %}" class="text-xl font-bold tracking-wider text-indigo-400">🏆 PRODE TERCIARIO</a>
        <div class="flex items-center space-x-6">
            <a href="{% url 'panel_prode' %}" class="hover:text-indigo-400 transition">Mis Jugadas</a>
            <a href="{% url 'ranking' %}" class="hover:text-indigo-400 transition">Ranking Global</a>
            
            {% if user.is_authenticated %}
                <span class="text-gray-400 text-sm">Hola, <b>{{ user.username }}</b></span>
                
                <form action="{% url 'logout' %}" method="POST" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="bg-red-950/60 hover:bg-red-900 border border-red-800 text-red-400 hover:text-red-300 text-xs font-bold px-3 py-1.5 rounded-lg transition duration-200">
                        Salir
                    </button>
                </form>
            {% endif %}
        </div>
    </nav>
    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
