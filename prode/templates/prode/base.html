{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProdIES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configuración personalizada de Tailwind para clavar exactos los colores del flyer
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonGreen: '#ccff00',  /* El verde lima/eléctrico del flyer */
                        neonCyan: '#00f0ff',   /* El azul cian tecnológico */
                        darkBg: '#0b0d10',     /* El fondo profundo, casi negro */
                        darkCard: '#141920',   /* Gris intermedio para tarjetas */
                        darkNav: '#0f1319'     /* Gris sutil para la barra de navegación */
                    }
                }
            }
        }
    </script>
    <style>
        /* Estilos globales rápidos para que los inputs de Django contrasten automáticamente en todas las vistas */
        input[type="text"], input[type="email"], input[type="password"], input[type="number"] {
            background-color: #1a222d !important;
            color: #ffffff !important;
            border: 1px solid #2d3748 !important;
            border-radius: 0.5rem !important;
            padding: 0.5rem 0.75rem !important;
        }
        input:focus {
            outline: none !important;
            border-color: #ccff00 !important; /* Foco neón */
            box-shadow: 0 0 8px rgba(204, 255, 0, 0.3) !important;
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 font-sans min-h-screen flex flex-col">
    
    <nav class="bg-darkNav border-b border-gray-800/80 px-6 py-4 flex justify-between items-center shadow-lg shadow-black/40">
        
        <a href="{% url 'panel_prode' %}" class="flex items-center gap-3 hover:opacity-80 transition duration-200">
            <img src="{% static 'prode/img/logo.png' %}" alt="Logo ProdIES" class="h-10 w-auto">
            <span class="text-xl font-black tracking-widest text-neonGreen">ProdIES</span>
        </a>
        
        <div class="flex items-center space-x-6">
            <a href="{% url 'acerca_de' %}" class="font-medium text-gray-300 hover:text-neonCyan transition duration-200">Acerca de</a>

            <a href="{% url 'panel_prode' %}" class="font-medium text-gray-300 hover:text-neonCyan transition duration-200">Mis Jugadas</a>
            <a href="{% url 'ranking' %}" class="font-medium text-gray-300 hover:text-neonCyan transition duration-200">Ranking Global</a>
            
            {% if user.is_authenticated %}
                <span class="text-gray-400 text-sm bg-darkCard px-3 py-1.5 rounded-md border border-gray-800">
                    Hola, <b class="text-white">{{ user.username }}</b>
                </span>
                
                <form action="{% url 'logout' %}" method="POST" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="bg-red-950/40 hover:bg-red-900/60 border border-red-900 text-red-400 hover:text-red-300 text-xs font-bold px-3 py-1.5 rounded-lg transition duration-200 shadow-md">
                        Salir
                    </button>
                </form>
            {% endif %}
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-darkNav/50 border-t border-gray-900 py-4 text-center text-xs text-gray-500">
        Desarrollado por "Alumnos de Programación III" <br>
        TS Desarrollo de Software • IES 9-018 • 2026
    </footer>

</body>
</html>
