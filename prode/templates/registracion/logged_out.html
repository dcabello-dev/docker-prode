{% extends 'prode/base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="bg-gray-800 p-8 rounded-xl border border-gray-700 shadow-2xl max-w-md w-full text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-950 text-indigo-400 mb-4 border border-indigo-800 animate-pulse">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
            </svg>
        </div>

        <h2 class="text-2xl font-extrabold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">
            Sesión Cerrada
        </h2>
        
        <p class="text-gray-400 text-sm mb-6">
            Saliste del sistema correctamente. ¡Gracias por participar del Prode!
        </p>

        <a href="{% url 'login' %}" 
           class="inline-block w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded-lg transition duration-200 shadow-md text-sm">
            Volver a Ingresar
        </a>
    </div>
</div>
{% endblock %}
