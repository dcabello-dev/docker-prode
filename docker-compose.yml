# ============================================================================
# Stack AISLADO del Prode Mundial Institucional (IES 9-018 Malargüe).
#
# Pensado para correr en el servidor del IES, SIN compartir red con otros
# stacks. Compose crea su red default y los servicios se resuelven entre sí
# por su `container_name` / `hostname`.
#
# Levantar:
#   docker compose up -d --build
#
# Si tenés un Cloudflare Tunnel / reverse proxy en este servidor, apuntalo
# al puerto publicado 8010 del host. Recordá setear en .env el dominio en
# DJANGO_ALLOWED_HOSTS y DJANGO_CSRF_TRUSTED_ORIGINS.
#
# Crear el superusuario admin (una sola vez, después de levantar):
#   docker compose exec web python manage.py crear_admin
# ============================================================================
services:
  db:
    image: postgres:16
    container_name: prode-postgres
    hostname: prode-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defini POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-prode}
    volumes:
      - prode_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prode} -d ${POSTGRES_DB:-prode}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: prode-mundial:latest
    container_name: prode-web
    hostname: prode-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defini DJANGO_SECRET_KEY en .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-prode.ies9018malargue.edu.ar}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://prode.ies9018malargue.edu.ar}
      # Conexión a PostgreSQL armada desde las variables de la base (un solo
      # lugar de verdad). El host es el nombre del contenedor de la DB.
      DATABASE_URL: postgres://${POSTGRES_USER:-prode}:${POSTGRES_PASSWORD:?Defini POSTGRES_PASSWORD en .env}@prode-postgres:5432/${POSTGRES_DB:-prode}
      # API-Football (RapidAPI) para sincronizar fixture y resultados
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
      API_FOOTBALL_LEAGUE_ID: ${API_FOOTBALL_LEAGUE_ID:-1}
      API_FOOTBALL_SEASON: ${API_FOOTBALL_SEASON:-2026}
    ports:
      - "8010:8000"

volumes:
  prode_pgdata:
