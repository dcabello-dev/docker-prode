# ============================================================================
# Stack AISLADO del Prode Mundial Institucional (IES 9-018 Malargüe).
#
# Pensado para correr en el servidor del IES, SIN compartir red con otros
# stacks. Compose crea su red default y los servicios se resuelven entre sí
# por su `container_name` / `hostname`.
#
# Levantar:
#   docker compose up -d --build
#
# Si tenés un Cloudflare Tunnel / reverse proxy en este servidor, apuntalo
# al puerto publicado 8010 del host. Recordá setear en .env el dominio en
# DJANGO_ALLOWED_HOSTS y DJANGO_CSRF_TRUSTED_ORIGINS.
#
# Crear el superusuario admin (una sola vez, después de levantar):
#   docker compose exec web python manage.py createsuperuser
# ============================================================================
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: prode-mundial:latest
    container_name: prode-web
    hostname: prode-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defini DJANGO_SECRET_KEY en .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-prode.ies9018malargue.edu.ar}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://prode.ies9018malargue.edu.ar}
      # La base SQLite vive en el volumen persistente, no en la imagen
      DJANGO_DB_PATH: /app/data/db.sqlite3
    volumes:
      - prode_data:/app/data
    ports:
      - "8010:8000"

volumes:
  prode_data:
