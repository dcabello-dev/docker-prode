# ==============================================================================
# Prode Mundial Institucional (IES 9-018 Malargüe) — Stack de PRODUCCIÓN.
# ------------------------------------------------------------------------------
# Topología:
#   - cloudflared (vive en su propia stack) enruta el dominio público
#       prode.ies9018malargue.edu.ar -> prode_app:8000
#     a través de la red externa compartida `lyntrix_network`.
#
#   - PostgreSQL vive en una red privada interna (`prode_internal_network`)
#     a la que cloudflared NO tiene acceso: solo el contenedor web la alcanza.
#
#   - Ningún servicio publica puertos al host: el tráfico público entra por el
#     Cloudflare Tunnel y el privado se resuelve por DNS interno de Docker.
#
# Requisito previo (una sola vez, antes del primer arranque):
#   docker network create lyntrix_network
#
# Levantar:
#   docker compose up -d --build
#
# Crear usuarios (después de levantar):
#   docker compose exec web python manage.py crear_usuario -u admin -p CLAVE -t admin
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # PostgreSQL - persistencia del Prode.
  # No está en lyntrix_network: solo el contenedor web lo alcanza por la
  # red interna privada.
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: prode-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prode}
      POSTGRES_USER: ${POSTGRES_USER:-prode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defini POSTGRES_PASSWORD en .env}
    volumes:
      - prode_postgres_data:/var/lib/postgresql/data
    networks:
      - prode_internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prode} -d ${POSTGRES_DB:-prode}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Web Django (gunicorn) - app del Prode.
  # Vive en dos redes:
  #   - prode_internal_network: para hablar con Postgres.
  #   - lyntrix_network:        para que cloudflared lo encuentre como
  #                             `prode_app:8000`.
  # El entrypoint corre migrate + collectstatic antes de arrancar gunicorn.
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: prode-mundial:latest
    container_name: prode_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Django core (settings.py lee estos nombres con prefijo DJANGO_)
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defini DJANGO_SECRET_KEY en .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-prode.ies9018malargue.edu.ar,localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://prode.ies9018malargue.edu.ar}

      # Conexión al Postgres del stack (resuelto por DNS interno de Docker).
      DATABASE_URL: postgres://${POSTGRES_USER:-prode}:${POSTGRES_PASSWORD:?Defini POSTGRES_PASSWORD en .env}@prode-postgres:5432/${POSTGRES_DB:-prode}

      # Detrás de Cloudflare (HTTPS lo termina el túnel/proxy).
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"

      # SofaScore: RapidAPI (APIDOJO) o API directa (auto = RapidAPI + fallback)
      SOFASCORE_BACKEND: ${SOFASCORE_BACKEND:-auto}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      RAPIDAPI_HOST: ${RAPIDAPI_HOST:-sofascore.p.rapidapi.com}
      SOFASCORE_SPORT: ${SOFASCORE_SPORT:-football}
      SOFASCORE_TOURNAMENT_ID: ${SOFASCORE_TOURNAMENT_ID:-0}
    volumes:
      # Estáticos recolectados (los sirve WhiteNoise) y media persistente.
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - prode_internal_network
      - lyntrix_network
    healthcheck:
      # Sin depender de curl: usa Python (ya está en la imagen).
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/accounts/login/').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ==============================================================================
# Redes
#
#   prode_internal_network  Red privada local del stack: Postgres + Web.
#                           Aislada de internet y de cloudflared.
#
#   lyntrix_network         Red externa compartida con cloudflared y otros
#                           servicios. Se DEBE crear previamente al primer
#                           arranque con:
#                             docker network create lyntrix_network
# ==============================================================================
networks:
  prode_internal_network:
    driver: bridge
  lyntrix_network:
    external: true

# ==============================================================================
# Volúmenes
#
#   prode_postgres_data     Persistencia del directorio de datos de Postgres
#                           en el host. NO eliminar entre upgrades.
# ==============================================================================
volumes:
  prode_postgres_data:
    driver: local
