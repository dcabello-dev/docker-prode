# ============================================================================
# Prode Mundial Institucional (IES 9-018 Malargüe) — servidor personal.
#
# Este stack NO levanta su propia base: usa la PostgreSQL compartida
# (db_central) y la red externa compartida (shared_network) del servidor.
#
# Requisitos previos en el servidor (una sola vez):
#   1) Que exista la red compartida:
#        docker network create shared_network   # si no existe
#   2) Que en db_central exista la base y el usuario del Prode:
#        docker exec -it db_central psql -U postgres -c \
#          "CREATE USER prode WITH PASSWORD 'TU_PASS';"
#        docker exec -it db_central psql -U postgres -c \
#          "CREATE DATABASE prode OWNER prode;"
#
# Levantar:
#   docker compose up -d --build
#
# Cloudflare Tunnel: apuntá el túnel al puerto publicado 8010 del host.
# Recordá setear el dominio en DJANGO_ALLOWED_HOSTS y DJANGO_CSRF_TRUSTED_ORIGINS.
#
# Crear usuarios (después de levantar):
#   docker compose exec web python manage.py crear_usuario -u admin -p CLAVE -t admin
# ============================================================================
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: prode-mundial:latest
    container_name: prode_app
    hostname: prode_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Django core (settings.py lee estos nombres con prefijo DJANGO_)
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defini DJANGO_SECRET_KEY en .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-prode.ies9018malargue.edu.ar,localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://prode.ies9018malargue.edu.ar}

      # Base compartida db_central (en la red shared_network).
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db_central:5432/${DB_NAME}

      # Detrás de Cloudflare (HTTPS lo termina el túnel/proxy).
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"

      # SofaScore: RapidAPI (APIDOJO) o API directa (auto = RapidAPI + fallback)
      SOFASCORE_BACKEND: ${SOFASCORE_BACKEND:-auto}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      RAPIDAPI_HOST: ${RAPIDAPI_HOST:-sofascore.p.rapidapi.com}
      SOFASCORE_SPORT: ${SOFASCORE_SPORT:-football}
      SOFASCORE_TOURNAMENT_ID: ${SOFASCORE_TOURNAMENT_ID:-0}

    volumes:
      # Estáticos recolectados (los sirve WhiteNoise) y media persistente.
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media

    ports:
      # Publicado en 8010 del host para el Cloudflare Tunnel.
      - "8010:8000"

    networks:
      - shared_network

    healthcheck:
      # Sin depender de curl: usa Python (ya está en la imagen).
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/accounts/login/').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  shared_network:
    external: true
    name: shared_network
